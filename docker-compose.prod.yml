# Production overrides: no hot-reload, no source bind-mounts, and nginx joined to
# the edge proxy network (the edge nginx handles TLS and proxies to load-balancer-nginx:8000).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Set EDGE_NETWORK if the edge network isn't named edge.
services:
  app1:
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes: !reset []
    restart: unless-stopped
  app2:
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes: !reset []
    restart: unless-stopped
  app3:
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes: !reset []
    restart: unless-stopped

  nginx:
    ports: !override
      - "127.0.0.1:8080:8000"
    restart: unless-stopped
    networks:
      default:
      edge:
        aliases:
          - load-balancer-nginx

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}
