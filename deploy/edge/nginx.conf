# Edge proxy for *.flyingpigs.dev (replaces Caddy). Sits behind Cloudflare
# ("Full (strict)") and terminates TLS with the Cloudflare Origin Certificate.
# Upstreams are containers on the external "edge" network, resolved at request
# time so nginx still starts when one of them is down.

resolver 127.0.0.11 valid=10s ipv6=off;

# Real client IP from Cloudflare
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Proxy defaults (match Caddy: websockets, no body size limit)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
client_max_body_size 0;

ssl_certificate     /certs/origin.pem;
ssl_certificate_key /certs/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;

# HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

# Unknown hostnames: refuse the TLS handshake
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# fixcore — the gateway container in fixcore_net_selfhost routes these by hostname
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fixcore-admin.flyingpigs.dev fixcore-api.flyingpigs.dev
                fixcore-admin-api.flyingpigs.dev fixcore-core.flyingpigs.dev;

    location / {
        set $upstream http://fixcore-gateway:80;
        proxy_pass $upstream;
    }
}

# nginx_load_balancer
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name load-balancer.flyingpigs.dev;

    location / {
        set $upstream http://load-balancer-nginx:8000;
        proxy_pass $upstream;
    }
}
